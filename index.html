<!doctype html>
<html lang="pl" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <style>
      html{font-synthesis: none; text-rendering: optimizeLegibility}
      body {visibility: hidden;}
      .styles-ready body {visibility: visible;}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=JetBrains+Mono:wght@100&family=Playfair+Display&display=swap" rel="stylesheet">
    <title>Oblique</title>
  </head>
  <body class="is-loading">
    
    <div class="loader">
      <h1 class="title">Oblique</h1>
      <p class="progress" aria-live="polite">0%</p>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <p class="loading-status" aria-live="polite"></p>
    </div>

      <div class="reveal" inert>
        <div class="curtain reveal-top"></div>
        <h1 class="reveal-title">Oblique</h1>
        <div class="curtain reveal-bottom"></div>
      </div>

        <header class="hero">
          <div class="hero-grid">

            <div class="hero-left">
              <!-- planet image - distort etc. -->
            </div>

            <div class="hero-right">

                <!-- SVG graphic for the header section -->
                <svg class="header-shape" viewBox="0 0 882 695" aria-label="Oblique header graphic">

                <!-- Define SVG filters, patterns, gradients, and masks -->
                <defs>

                  <!-- Wave filter: creates a turbulence effect for distortion -->
                  <filter id="wave" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence baseFrequency="0.2" numOctaves="2" seed="2" result="turb"/>
                    <feOffset in="turb" dx="0" dy="0" result="turbShifted"/>
                    <feDisplacementMap in="SourceGraphic" in2="turbShifted" scale="8" xChannelSelector="R" yChannelSelector="G" />
                  </filter>

                    <!-- Image fill for the hero shape -->
                    <pattern id="imgFill" patternUnits="userSpaceOnUse" width="882" height="695"> 
                      <image href="./assets/photo-1.jpg" width="882" height="695" preserveAspectRatio="xMidYMid slice"/>
                    </pattern>

                    <!-- Radial gradient: creates center fade effect from white to black -->
                    <radialGradient id="centerFadeOBB" gradientUnits="objectBoundingBox" cx="0.5" cy="0.5" r="0.6">
                      <stop offset="0%"   stop-color="white"/>
                      <stop offset="72%"  stop-color="white"/>
                      <stop offset="100%" stop-color="black"/>
                    </radialGradient>

                    <!-- Mask: applies center fade gradient to create vignette effect -->
                    <mask id="centerMask" maskUnits="userSpaceOnUse" x="0" y="0" width="882" height="695">
                      <path d="M882 653C882 675.091 864.091 693 842 693H577C554.909 693 537 675.091 537 653V439C537 416.909 519.091 399 497 399H40C17.9086 399 0 381.091 0 359V40C0 17.9086 17.9086 0 40 0H842C864.091 0 882 17.9086 882 40V653Z" fill="url(#centerFadeOBB)"/>
                    </mask>

                 </defs>

                 <!-- SVG path - our hero shape - bottom path -->
                <path d="M882 653C882 675.091 864.091 693 842 693H577C554.909 693 537 675.091 537 653V439C537 416.909 519.091 399 497 399H40C17.9086 399 0 381.091 0 359V40C0 17.9086 17.9086 0 40 0H842C864.091 0 882 17.9086 882 40V653Z" fill="url(#imgFill)" opacity="0.9"/>

                <!-- Top layer: with filter and mask -->
                <path d="M882 653C882 675.091 864.091 693 842 693H577C554.909 693 537 675.091 537 653V439C537 416.909 519.091 399 497 399H40C17.9086 399 0 381.091 0 359V40C0 17.9086 17.9086 0 40 0H842C864.091 0 882 17.9086 882 40V653Z" fill="url(#imgFill)" opacity="0.9" filter="url(#wave)" mask="url(#centerMask)"/>
                 <!-- CTA shape - echo -->
                <path id="echo-CTA" d="M476 0C498.091 0 516 17.9086 516 40V223C516 245.091 498.091 263 476 263H90.3701L0 149.669V40C2.06163e-06 17.9086 17.9086 0 40 0H476Z" fill="#A3534C" opacity="0.9" transform="translate(10, 410)"/>
              </svg>  
              <div class="alpha-container">
                <h1 class="alpha">SECTOR V-07 ALPHA</h1>
                <p class="alpha-p">Every click is a choice. Every scroll, a story. <br/> This is not just development. It's controlled distortion.</p>
              </div>
              
              <div class="CTA-container">
                <h1 class="echo-heading">YOUR ECHO, NOT YOUR VOICE</h1>
                <a href="#" class="CTA-button">CONTACT</a>
              </div>
            </div>

          </div>
          
        </header>


    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
