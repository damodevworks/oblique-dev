<!doctype html>
<html lang="pl" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <style>
      html{font-synthesis: none; text-rendering: optimizeLegibility}
      body {visibility: hidden;}
      .styles-ready body {visibility: visible;}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=JetBrains+Mono:wght@100&family=Playfair+Display&display=swap" rel="stylesheet">
    <title>Oblique</title>
  </head>
  <body class="is-loading">
    
    <div class="loader">
      <h1 class="title">Oblique</h1>
      <p class="progress" aria-live="polite">0%</p>
      <div class="loading-bar-container">
        <div class="loading-bar"></div>
      </div>
      <p class="loading-status" aria-live="polite"></p>
    </div>

      <div class="reveal" inert>
        <div class="curtain reveal-top"></div>
        <h1 class="reveal-title">Oblique</h1>
        <div class="curtain reveal-bottom"></div>
      </div>

        <header class="hero">
          <div class="hero-grid">

            <div class="hero-left">
              <!-- planet image - distort etc. -->
            </div>

            <div class="hero-right">

              <svg class="header-shape" viewBox ="0 0 882 695" aria-label="Oblique header graphic">
                <!-- FeTurbulence filter -->
                 <defs> 
                    <filter>
                      <feTurbulence baseFrequency="0.5" numOctaves="2" seed="2"/>
                    </filter>

                    <!-- Image fill for the hero shape -->
                    <pattern id="imgFill" patternUnits="userSpaceOnUse" width="882" height="695"> 
                      <image href="./assets/photo-1.jpg" width="882" height="695" preserveAspectRatio="xMidYMid slice"/>
                    </pattern>

                 </defs>

                 <!-- SVG path - our hero shape -->
                <path d="M882 653C882 675.091 864.091 693 842 693H577C554.909 693 537 675.091 537 653V439C537 416.909 519.091 399 497 399H40C17.9086 399 0 381.091 0 359V40C0 17.9086 17.9086 0 40 0H842C864.091 0 882 17.9086 882 40V653Z" fill="url(#imgFill)" />
              </svg>  

              <!-- CTA + another SVG later on -->
            </div>

          </div>
          
        </header>


    <script type="module" src="/src/scripts/main.js"></script>
  </body>
</html>
